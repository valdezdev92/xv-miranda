server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # --- compresión ---------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- cabeceras de seguridad ---------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- sonda de salud para Coolify y el HEALTHCHECK de Docker -------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- compatibilidad con clientes que solicitan el icono clásico --
    location = /favicon.ico {
        access_log off;
        return 302 /assets/favicon.svg;
    }

    # --- el HTML nunca se cachea: así un cambio se ve al instante -----
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- la configuración tampoco, para poder cambiar el WhatsApp -----
    location = /assets/config.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- fotos, música e íconos: caché larga --------------------------
    location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|mp3|m4a|ogg|woff2)$ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
